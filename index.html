            if (t.textContent.trim() && range.intersectsNode(t)) { achou = t; break; }
          }
          if (achou) n = achou;
        }
        return n.nodeType === 1 ? n : n.parentElement;
      }

      // mostra na barra o que a seleção tem hoje (fonte, tamanho, negrito)
      function atualizarBarraEd() {
        const tem = temSelecao();
        barraEd.classList.toggle('sem-selecao', !tem);
        if (!tem) return;
        const el = elementoDoInicio(selSalva.range);
        if (!el) return;
        const cs = getComputedStyle(el);
        const nome = /arial|helvetica|liberation sans/i.test(cs.fontFamily.split(',')[0]) ? 'Arial' : 'Times New Roman';
        edFonteNome.textContent = nome;
        Array.prototype.forEach.call(popFonte.querySelectorAll('button'), function (b) {
          b.classList.toggle('ativo', b.dataset.fonte === nome);
        });
        if (document.activeElement !== edTamanho) edTamanho.value = formatarTamanho(parseFloat(cs.fontSize));
        edNegrito.classList.toggle('ativo', parseInt(cs.fontWeight, 10) >= 600);
      }

      document.addEventListener('selectionchange', function () {
        if (!editorAtivo) return;
        if (barraEd.contains(document.activeElement)) return; // digitando no campo do tamanho: guarda a seleção da folha
        if (!capturarSelecao()) selSalva = null;
        atualizarBarraEd();
      });

      // roda uma alteração sobre o texto selecionado (devolve false se não há seleção)
      function comSelecao(fn) {
        if (!editorAtivo || !temSelecao()) return false;
        const host = selSalva.host;
        if (!host.isConnected) { selSalva = null; atualizarBarraEd(); return false; }
        if (document.activeElement !== host) host.focus({ preventScroll: true });
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(selSalva.range);
        document.execCommand('styleWithCSS', false, true);
        fn(host);
        guardarFolha(host);
        capturarSelecao();
        atualizarBarraEd();
        return true;
      }

      function aplicarFonte(nome) {
        comSelecao(function () { document.execCommand('fontName', false, FONTES[nome]); });
      }

      function aplicarCor(cor) {
        comSelecao(function () { document.execCommand('foreColor', false, cor); });
      }

      function alternarNegrito() {
        comSelecao(function () { document.execCommand('bold'); });
      }

      // O navegador só sabe aplicar tamanhos de 1 a 7. Aplica o 7 e troca cada <font size="7"> por um <span> com o tamanho em px.
      function aplicarTamanho(px) {
        px = Math.min(TAMANHO_MAX, Math.max(TAMANHO_MIN, px));
        const ok = comSelecao(function (host) {
          document.execCommand('styleWithCSS', false, false);
          document.execCommand('fontSize', false, '7');
          document.execCommand('styleWithCSS', false, true);
          const fontes = host.querySelectorAll('font[size="7"]');
          if (!fontes.length) return;
          let primeiro = null, ultimo = null;
          Array.prototype.forEach.call(fontes, function (f) {
            const sp = document.createElement('span');
            sp.style.fontSize = px + 'px';
            while (f.firstChild) sp.appendChild(f.firstChild);
            f.parentNode.replaceChild(sp, f);
            if (!primeiro) primeiro = sp;
            ultimo = sp;
          });
          const nr = document.createRange();
          nr.setStart(primeiro, 0);
          nr.setEnd(ultimo, ultimo.childNodes.length);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(nr);
        });
        if (ok) edTamanho.value = formatarTamanho(px);
      }

      // ----- menus suspensos (fonte e cor) -----
      function fecharPopups(exceto) {
        [popFonte, popCor].forEach(function (p) { if (p !== exceto) p.classList.remove('aberto'); });
      }
      function alternarPopup(pop, botao) {
        fecharPopups(pop);
        if (pop.classList.contains('aberto')) { pop.classList.remove('aberto'); return; }
        if (!temSelecao()) return; // sem texto selecionado não há o que alterar
        pop.style.left = botao.offsetLeft + 'px';
        pop.classList.add('aberto');
      }

      // clicar nos botões da barra não tira o foco (nem a seleção) do texto; só o campo do tamanho recebe o foco
      barraEd.addEventListener('mousedown', function (e) {
        if (e.target !== edTamanho) e.preventDefault();
      });
      document.addEventListener('mousedown', function (e) {
        if (e.target.closest && !e.target.closest('.ed-popup, #edFonte, #edCor')) fecharPopups();
      });

      edFonte.addEventListener('click', function () { alternarPopup(popFonte, edFonte); });
      edCor.addEventListener('click', function () { alternarPopup(popCor, edCor); });
      popFonte.addEventListener('click', function (e) {
        const b = e.target.closest('button[data-fonte]');
        if (!b) return;
        fecharPopups();
        aplicarFonte(b.dataset.fonte);
      });
      popCor.addEventListener('click', function (e) {
        const b = e.target.closest('button[data-cor]');
        if (!b) return;
        fecharPopups();
        aplicarCor(b.dataset.cor);
      });
      edNegrito.addEventListener('click', alternarNegrito);

      // tamanho: + e − mudam de PASSO_TAMANHO em PASSO_TAMANHO; o campo aceita um número (com vírgula) + Enter
      function passoTamanho(sinal) {
        if (!temSelecao()) return;
        const base = lerTamanho(edTamanho.value);
        if (base === null) { atualizarBarraEd(); return; }
        aplicarTamanho(Math.round((base + sinal * PASSO_TAMANHO) * 100) / 100);
      }
      edMais.addEventListener('click', function () { passoTamanho(1); });
      edMenos.addEventListener('click', function () { passoTamanho(-1); });
      edTamanho.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const n = lerTamanho(edTamanho.value);
          if (n === null || !temSelecao()) { edTamanho.blur(); atualizarBarraEd(); return; }
          aplicarTamanho(n); // devolve o foco para a folha (comSelecao)
        } else if (e.key === 'Escape') {
          e.preventDefault();
          edTamanho.blur();
          atualizarBarraEd();
        }
      });
      edTamanho.addEventListener('blur', function () { atualizarBarraEd(); }); // sem Enter, o que foi digitado é descartado

      // ----- eventos dentro das folhas -----
      document.addEventListener('input', function (e) {
        const host = e.target.closest && e.target.closest(SEL_EDITAVEL);
        if (host) guardarFolha(host);
      });

      // colar entra como texto puro (sem trazer fontes e cores de outros programas)
      document.addEventListener('paste', function (e) {
        const host = e.target.closest && e.target.closest(SEL_EDITAVEL);
        if (!host) return;
        e.preventDefault();
        const cd = e.clipboardData || window.clipboardData;
        const t = cd ? cd.getData('text/plain') : '';
        if (t) document.execCommand('insertText', false, t);
      });

      // Ctrl+B = botão N; Ctrl+I e Ctrl+U ficam desligados (itálico e sublinhado não fazem parte desta etapa)
      document.addEventListener('keydown', function (e) {
        if (!editorAtivo || !(e.ctrlKey || e.metaKey) || e.altKey) return;
        if (!(e.target.closest && e.target.closest(SEL_EDITAVEL))) return;
        const k = (e.key || '').toLowerCase();
        if (k === 'b') { e.preventDefault(); alternarNegrito(); }
        else if (k === 'i' || k === 'u') e.preventDefault();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') fecharPopups();
      });

      // ao sair do editor
      function limparEdicao() {
        selSalva = null;
        fecharPopups();
        barraEd.classList.add('sem-selecao');
      }
      // ---------- 15) NOVO-PAGINACAO: paginação automática ----------
      // O texto do livro é um fluxo único de blocos (parágrafos e títulos). Depois de cada alteração o fluxo é
      // redistribuído nas folhas: o que não cabe desce para a próxima folha (um parágrafo pode ser cortado no fim
      // de uma linha) e, quando se apaga texto, o que está na folha de baixo sobe. A medida é feita numa folha
      // invisível com as mesmas regras de estilo (.folha), então o resultado é o mesmo que o leitor vai ver.
      // Um parágrafo cortado ganha marcas: o pedaço de cima recebe data-cont-next e o de baixo recebe data-cont.
      const LIMITE_TEXTO = ALTURA_FOLHA - 100; // o texto precisa terminar aqui (a margem de baixo da folha é 100px)
      const medidor = document.createElement('div');
      medidor.className = 'medidor-folha';
      medidor.setAttribute('aria-hidden', 'true');
      const medFolha = document.createElement('div');
      medFolha.className = 'folha';
      medidor.appendChild(medFolha);
      document.body.appendChild(medidor);
      let compondo = false;      // true durante a digitação com acento ou IME: espera terminar para reorganizar
      let reorganizando = false;

      // ----- utilidades de texto -----
      function nosDeTexto(raiz) {
        const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
        const lista = [];
        let n;
        while ((n = w.nextNode())) lista.push(n);
        return lista;
      }
      function comprimento(raiz) {
        let t = 0;
        nosDeTexto(raiz).forEach(function (n) { t += n.nodeValue.length; });
        return t;
      }
      // k-ésimo caractere do texto de `raiz` -> { no, off } (no fim de um trecho, escolhe o trecho anterior)
      function posicaoNoTexto(raiz, k) {
        const nos = nosDeTexto(raiz);
        let acc = 0;
        for (let i = 0; i < nos.length; i++) {
          const len = nos[i].nodeValue.length;
          if (k <= acc + len) return { no: nos[i], off: k - acc };
          acc += len;
        }
        const u = nos[nos.length - 1];
        return u ? { no: u, off: u.nodeValue.length } : null;
      }

      // ----- blocos de uma folha -----
      function listaTopo(raiz) {
        return Array.prototype.filter.call(raiz.childNodes, function (n) {
          return (n.nodeType === 1 && !n.classList.contains('num')) || (n.nodeType === 3 && n.nodeValue.trim() !== '');
        });
      }
      // devolve sempre um <p> ou <h2> (texto solto e <div> viram parágrafo)
      function normalizar(item) {
        if (item.nodeType === 3) {
          const p = document.createElement('p');
          p.textContent = item.nodeValue;
          return p;
        }
        if (item.tagName === 'P' || item.tagName === 'H2') return item.cloneNode(true);
        const p = document.createElement('p');
        p.innerHTML = item.innerHTML;
        if (!p.firstChild) p.appendChild(document.createElement('br'));
        return p;
      }
      function serializar(host) {
        const c = host.cloneNode(true);
        const num = c.querySelector('.num');
        if (num) num.remove();
        return c.innerHTML;
      }
      function primeiroEhCont(p) {
        const tmp = document.createElement('div');
        tmp.innerHTML = paginas[p] || '';
        const it = listaTopo(tmp)[0];
        return !!(it && it.nodeType === 1 && it.hasAttribute('data-cont'));
      }

      // ----- medição -----
      function cabe(b) { return b.offsetTop + b.offsetHeight <= LIMITE_TEXTO + 0.5; }

      function fragmentoAte(b, k) { // cópia de b só com os k primeiros caracteres
        const c = b.cloneNode(true);
        const pos = posicaoNoTexto(c, k);
        if (pos) {
          const r = document.createRange();
          r.setStart(pos.no, pos.off);
          r.setEnd(c, c.childNodes.length);
          r.deleteContents();
        }
        return c;
      }

      // maior número de caracteres de b que cabem no que resta da folha (b é o último bloco da folha de medição)
      function maiorPrefixoQueCabe(b) {
        const total = comprimento(b);
        if (total === 0) return 0;
        const pai = b.parentNode;
        pai.removeChild(b);
        let lo = 0, hi = total;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          const c = fragmentoAte(b, mid);
          pai.appendChild(c);
          const ok = cabe(c);
          pai.removeChild(c);
          if (ok) lo = mid; else hi = mid - 1;
        }
        pai.appendChild(b);
        return lo;
      }

      // corta b no caractere k: devolve o pedaço de cima; b passa a ser o pedaço de baixo
      function dividir(b, k) {
        const pos = posicaoNoTexto(b, k);
        const r = document.createRange();
        r.setStart(b, 0);
        r.setEnd(pos.no, pos.off);
        const frag = r.extractContents();
        const primeiro = document.createElement(b.tagName);
        Array.prototype.forEach.call(b.attributes, function (a) { primeiro.setAttribute(a.name, a.value); });
        primeiro.removeAttribute('data-cont-next');
        primeiro.appendChild(frag);
        return primeiro;
      }

      // junta as folhas da página i0 em diante num fluxo contínuo de blocos
      function construirFluxo(i0) {
        const blocos = [], lens = [], mapa = [];
        for (let p = i0; p < paginas.length; p++) {
          const tmp = document.createElement('div');
          tmp.innerHTML = paginas[p];
          const m = [];
          listaTopo(tmp).forEach(function (item, j) {
            const el = normalizar(item);
            const cont = j === 0 && item.nodeType === 1 && item.hasAttribute('data-cont') && blocos.length > 0;
            el.removeAttribute('data-cont');
            el.removeAttribute('data-cont-next');
            if (cont) { // continuação do parágrafo da folha anterior: volta a ser um parágrafo só
              const mi = blocos.length - 1;
              const base = lens[mi];
              blocos[mi].insertAdjacentHTML('beforeend', el.innerHTML);
              lens[mi] = base + comprimento(el);
              m.push({ mi: mi, base: base });
            } else {
              el.__mi = blocos.length;
              m.push({ mi: blocos.length, base: 0 });
              blocos.push(el);
              lens.push(comprimento(el));
            }
          });
          mapa.push(m);
        }
        if (!blocos.length) {
          const el = document.createElement('p');
          el.appendChild(document.createElement('br'));
          el.__mi = 0;
          blocos.push(el);
          lens.push(0);
        }
        return { blocos: blocos, mapa: mapa };
      }

      // distribui os blocos em folhas; devolve o HTML de cada folha e onde cada pedaço de texto foi parar
      function distribuir(blocos) {
        medFolha.textContent = '';
        const saida = [], frags = [];
        let atual = [];
        const fila = blocos.slice();
        function fecharPagina() {
          // um título sozinho no fim da folha vai junto com o texto dele para a próxima
          while (atual.length > 1 && atual[atual.length - 1].el.tagName === 'H2') {
            const u = atual.pop();
            medFolha.removeChild(u.el);
            fila.unshift(u.el);
          }
          const pg = saida.length;
          atual.forEach(function (x, pos) {
            frags.push({ mi: x.el.__mi, ini: x.ini, len: x.len, pag: pg, pos: pos });
          });
          saida.push(atual.map(function (x) { return x.el.outerHTML; }).join(''));
          atual = [];
          medFolha.textContent = '';
        }
        let guarda = 0;
        while (fila.length && guarda++ < 200000) {
          const b = fila.shift();
          medFolha.appendChild(b);
          if (cabe(b)) { atual.push({ el: b, ini: b.__ini || 0, len: comprimento(b) }); continue; }
          // não cabe: parágrafo pode ser cortado no fim de uma linha
          if (b.tagName === 'P' && comprimento(b) > 0) {
            const total = comprimento(b);
            const k = maiorPrefixoQueCabe(b);
            if (k > 0 && k < total) {
              const ini = b.__ini || 0;
              const primeiro = dividir(b, k);
              primeiro.__mi = b.__mi;
              primeiro.setAttribute('data-cont-next', '1');
              medFolha.removeChild(b);
              medFolha.appendChild(primeiro);
              atual.push({ el: primeiro, ini: ini, len: k });
              b.__ini = ini + k;
              b.setAttribute('data-cont', '1');
              fila.unshift(b);
              fecharPagina();
              continue;
            }
          }
          if (atual.length === 0) { // sozinho e não cabe nem cortado: fica (o excesso é escondido) para não travar
            atual.push({ el: b, ini: b.__ini || 0, len: comprimento(b) });
            fecharPagina();
            continue;
          }
          medFolha.removeChild(b);
          fila.unshift(b);
          fecharPagina();
        }
        if (atual.length || saida.length === 0) fecharPagina();
        return { saida: saida, frags: frags };
      }

      // ----- cursor -----
      function hostDaPagina(idx) {
        const lados = [esq, dir];
        for (let i = 0; i < lados.length; i++) {
          const h = lados[i].querySelector('.folha[data-pg="' + idx + '"]');
          if (h) return h;
        }
        return null;
      }

      // onde está a seleção dentro da folha: bloco (j) e caractere dentro do bloco (off), no começo e no fim
      function selecaoInfo(host) {
        const s = window.getSelection();
        if (!s || !s.rangeCount) return null;
        const r = s.getRangeAt(0);
        if (!host.contains(r.startContainer) || !host.contains(r.endContainer)) return null;
        const itens = listaTopo(host);
        const loc = function (no, off) {
          let j = -1;
          for (let i = 0; i < itens.length; i++) { if (itens[i] === no || itens[i].contains(no)) { j = i; break; } }
          if (j < 0) return { j: 0, off: 0 };
          const rr = document.createRange();
          rr.setStart(itens[j], 0);
          rr.setEnd(no, off);
          return { j: j, off: rr.toString().length };
        };
        const a = loc(r.startContainer, r.startOffset);
        const b = r.collapsed ? a : loc(r.endContainer, r.endOffset);
        return { pag: parseInt(host.dataset.pg, 10) - 1, j: a.j, off: a.off, j2: b.j, off2: b.off };
      }

      function aplicarSelecao(host, j1, o1, j2, o2) {
        const itens = listaTopo(host);
        const ponto = function (j, o) {
          const it = itens[j] || itens[itens.length - 1];
          if (!it) return { no: host, off: 0 };
          const pos = posicaoNoTexto(it, o);
          return pos ? { no: pos.no, off: pos.off } : { no: it, off: 0 };
        };
        const a = ponto(j1, o1);
        const b = (j2 === undefined) ? a : ponto(j2, o2);
        const r = document.createRange();
        r.setStart(a.no, a.off);
        r.setEnd(b.no, b.off);
        host.focus({ preventScroll: true });
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }

      // põe o cursor (ou a seleção) na página p (índice a partir de 0), virando para a abertura dela se for preciso
      function colocarSelecaoEm(p1, j1, o1, p2, j2, o2, jaRedesenhou) {
        const idx = p1 + 1;
        const s = Math.ceil(idx / 2);
        const fazer = function () {
          const host = hostDaPagina(idx);
          if (!host) return;
          if (p2 !== undefined && p2 !== p1) aplicarSelecao(host, j1, o1);
          else aplicarSelecao(host, j1, o1, j2, o2);
        };
        if (estado.livro !== s) {
          estado.livro = s;
          desenhar();            // abertura trocada na hora (sem animação, para não perder o que está sendo digitado)
          setTimeout(fazer, 0);
        } else if (jaRedesenhou) {
          setTimeout(fazer, 0);
        } else {
          fazer();
        }
      }

      function acharFrag(frags, pt, pagPreferida) {
        let escolhido = null;
        for (let i = 0; i < frags.length; i++) {
          const f = frags[i];
          if (f.mi !== pt.mi || pt.off < f.ini || pt.off > f.ini + f.len) continue;
          if (!escolhido) escolhido = f;
          if (f.pag === pagPreferida) return f; // no limite entre duas folhas, fica na folha onde o cursor já estava
        }
        return escolhido;
      }

      // ----- a reorganização -----
      // i0: primeira página a refazer; sel: seleção (em índices de página) ou null; forcar: refaz as folhas da tela
      function repaginar(i0, sel, forcar) {
        if (reorganizando) return;
        reorganizando = true;
        let redesenhou = false;
        try {
          const totalAntes = paginas.length;
          const fl = construirFluxo(i0);
          let ini = null, fim = null;
          if (sel && sel.pag >= i0 && fl.mapa[sel.pag - i0]) {
            const m = fl.mapa[sel.pag - i0];
            const a = m[sel.j], b = m[sel.j2 === undefined ? sel.j : sel.j2];
            if (a) ini = { mi: a.mi, off: a.base + sel.off };
            if (b) fim = { mi: b.mi, off: b.base + (sel.off2 === undefined ? sel.off : sel.off2) };
          }
          const d = distribuir(fl.blocos);

          paginas.length = i0;
          d.saida.forEach(function (h) { paginas.push(h); });
          TOTAL_LIVRO = paginas.length + 2;
          const mudouTotal = paginas.length !== totalAntes;

          // abertura atual precisa continuar existindo
          const maxAb = Math.max(0, totalAberturas() - 1);
          let precisaRedesenho = false;
          if (estado.livro > maxAb) { estado.livro = maxAb; precisaRedesenho = true; }

          // as folhas que estão na tela têm que mostrar o que as páginas passaram a ter
          const esperadas = paginasDe(estado.livro);
          [esperadas.esq, esperadas.dir].forEach(function (idx) {
            if (idx === null) return;
            if (!hostDaPagina(idx)) precisaRedesenho = true;
          });
          [esq, dir].forEach(function (lado) {
            const h = lado.querySelector('.folha[data-pg]');
            if (!h) return;
            const p = parseInt(h.dataset.pg, 10) - 1;
            if (p >= paginas.length) { precisaRedesenho = true; return; }
            if (serializar(h) !== paginas[p]) {
              if (forcar || true) {
                h.innerHTML = paginas[p] + '<div class="num" contenteditable="false">' + (p + 1) + '</div>';
              }
            }
          });
          if (precisaRedesenho) { desenhar(); redesenhou = true; }
          else if (mudouTotal) atualizarBotoes();

          // devolve o cursor ao mesmo ponto do texto
          if (ini) {
            const f1 = acharFrag(d.frags, ini, sel.pag - i0);
            const f2 = fim ? acharFrag(d.frags, fim, sel.pag - i0) : f1;
            if (f1) {
              const p1 = i0 + f1.pag, o1 = ini.off - f1.ini;
              const igual = !redesenhou && p1 === sel.pag && f1.pos === sel.j && o1 === sel.off;
              if (!igual || forcar) {
                if (f2 && fim) colocarSelecaoEm(p1, f1.pos, o1, i0 + f2.pag, f2.pos, fim.off - f2.ini, redesenhou);
                else colocarSelecaoEm(p1, f1.pos, o1, undefined, undefined, undefined, redesenhou);
              }
            }
          }
        } finally {
          reorganizando = false;
        }
      }

      function repaginarAPartir(host) {
        if (compondo || reorganizando || !editorAtivo) return;
        const idx = parseInt(host.dataset.pg, 10);
        if (!(idx >= 1 && idx <= paginas.length)) return;
        const e = idx - 1;
        let i0 = Math.max(0, e - 1);
        while (i0 > 0 && primeiroEhCont(i0)) i0--;
        repaginar(i0, selecaoInfo(host), false);
      }

      function repaginarTudo() {
        repaginar(0, null, false);
      }

      // ----- teclas que cruzam a divisa entre duas folhas -----
      function hostDoCursor() {
        const s = window.getSelection();
        if (!s || !s.rangeCount) return null;
        const n = s.anchorNode;
        const el = n && (n.nodeType === 1 ? n : n.parentElement);
        return (el && el.closest && el.closest(SEL_EDITAVEL)) || null;
      }
      function posicaoNaFolha(host) { // { primeiro, ultimo, vazioAntes, vazioDepois } do cursor
        const s = window.getSelection();
        const itens = listaTopo(host);
        const n = s.anchorNode;
        let j = -1;
        for (let i = 0; i < itens.length; i++) { if (itens[i] === n || itens[i].contains(n)) { j = i; break; } }
        const antes = document.createRange();
        antes.setStart(host, 0);
        antes.setEnd(s.anchorNode, s.anchorOffset);
        let depois = '';
        if (j >= 0) {
          const rd = document.createRange();
          rd.setStart(s.anchorNode, s.anchorOffset);
          rd.setEnd(itens[itens.length - 1], itens[itens.length - 1].childNodes.length);
          depois = rd.toString();
        }
        return { j: j, n: itens.length, antes: antes.toString(), depois: depois };
      }
      function apagarUltimoCaractere(el) {
        const total = comprimento(el);
        if (!total) return;
        const a = posicaoNoTexto(el, total - 1), b = posicaoNoTexto(el, total);
        const r = document.createRange();
        r.setStart(a.no, a.off);
        r.setEnd(b.no, b.off);
        r.deleteContents();
      }

      // Backspace no começo da folha: apaga o caractere antes (mesmo parágrafo) ou junta com o parágrafo de cima
      function apagarNoInicioDaFolha(host) {
        const e = parseInt(host.dataset.pg, 10) - 1;
        if (e <= 0) return;
        const ant = document.createElement('div'); ant.innerHTML = paginas[e - 1];
        const cur = document.createElement('div'); cur.innerHTML = serializar(host);
        const itAnt = listaTopo(ant), itCur = listaTopo(cur);
        if (!itAnt.length) { paginas[e - 1] = '<p><br></p>'; itAnt.push(listaTopo(ant)[0]); }
        const ultimo = itAnt[itAnt.length - 1];
        const primeiro = itCur[0];
        if (primeiro && primeiro.nodeType === 1 && primeiro.hasAttribute('data-cont')) {
          apagarUltimoCaractere(ultimo); // é o mesmo parágrafo: o Backspace apaga o último caractere da folha de cima
        } else if (primeiro) {
          if (comprimento(primeiro) > 0) {
            if (comprimento(ultimo) === 0) ultimo.innerHTML = '';
            ultimo.insertAdjacentHTML('beforeend', primeiro.nodeType === 1 ? primeiro.innerHTML : primeiro.nodeValue);
          }
          if (primeiro.parentNode) primeiro.parentNode.removeChild(primeiro);
        }
        const base = comprimento(ultimo) - (primeiro && primeiro.nodeType === 1 && !primeiro.hasAttribute('data-cont') ? comprimento(primeiro) : 0);
        paginas[e - 1] = ant.innerHTML;
        paginas[e] = cur.innerHTML;
        let i0 = Math.max(0, e - 2);
        while (i0 > 0 && primeiroEhCont(i0)) i0--;
        repaginar(i0, { pag: e - 1, j: itAnt.length - 1, off: Math.max(0, base) }, true);
      }

      function irParaFimDaPagina(p) {
        const t = document.createElement('div'); t.innerHTML = paginas[p];
        const it = listaTopo(t);
        const j = Math.max(0, it.length - 1);
        colocarSelecaoEm(p, j, it[j] ? comprimento(it[j]) : 0, undefined, undefined, undefined, false);
      }

      document.addEventListener('keydown', function (e) {
        if (!editorAtivo || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        if (e.key !== 'Backspace' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const host = hostDoCursor();
        const s = window.getSelection();
        if (!host || !s.isCollapsed) return;
        const idx = parseInt(host.dataset.pg, 10);
        const pos = posicaoNaFolha(host);
        const noInicio = pos.j === 0 && pos.antes === '';
        const noFim = pos.j === pos.n - 1 && pos.depois === '';
        if (e.key === 'Backspace' && noInicio) {
          e.preventDefault();
          apagarNoInicioDaFolha(host);
        } else if (e.key === 'ArrowLeft' && noInicio && idx > 1) {
          e.preventDefault();
          irParaFimDaPagina(idx - 2);
        } else if (e.key === 'ArrowRight' && noFim && idx < paginas.length) {
          e.preventDefault();
          colocarSelecaoEm(idx, 0, 0, undefined, undefined, undefined, false);
        }
      });

      // acentos e IME: só reorganiza quando a composição termina
      document.addEventListener('compositionstart', function () { compondo = true; });
      document.addEventListener('compositionend', function (e) {
        compondo = false;
        const host = e.target && e.target.closest && e.target.closest(SEL_EDITAVEL);
        if (host) guardarFolha(host);
      });

      barraEd.classList.add('sem-selecao');

      entrarModo('livro');
      ajustarEscala();
    })();
  </script>

  <!-- ===================== NOVO-MOBILE: ZOOM, ARRASTO E MENU DO CELULAR ===================== -->
  <script>
    (function () {
      const raiz = document.documentElement;
      const cartao = document.querySelector('.cartao');
      const btnMenu = document.getElementById('btnMenu');
      const menu = document.getElementById('menuLateral');
      const fundoMenu = document.getElementById('fundoMenu');

      const ALTURA_BARRA = 48;      // altura da barra de cima (igual ao CSS)
      const MARGEM_H = 12;          // folga entre o cartão e as bordas laterais da tela
      const MARGEM_V = 16;          // folga entre o cartão e as barras de cima e de baixo
      const LARGURA_MIN = 200;
      const ZOOM_MAX = 4;
      const PROPORCAO = 420 / 297;  // largura / altura do cartão

      let zoom = 1, tx = 0, ty = 0; // zoom atual e posição do canto superior esquerdo do cartão
      let larguraBase = 0;          // largura do cartão com zoom 1
      let quadro = 0;               // desenho agendado

      function celular() { return raiz.classList.contains('mobile'); }

      // tamanho do cartão sem zoom: 93% da largura da tela (ou o que a altura permitir)
      function medir() {
        larguraBase = Math.max(LARGURA_MIN, Math.min(
          window.innerWidth * 0.93,
          (window.innerHeight - 2 * (ALTURA_BARRA + MARGEM_V)) * PROPORCAO
        ));
      }

      function dimensoes() {
        const w = larguraBase * zoom;
        return { w: w, h: w / PROPORCAO };
      }

      // mantém o cartão dentro dos limites: se cabe na tela fica centralizado, se não cabe dá para ver qualquer parte dele
      function limitar() {
        const d = dimensoes();
        const vw = window.innerWidth, vh = window.innerHeight;
        const topo = ALTURA_BARRA + MARGEM_V, base = vh - topo;
        tx = d.w > vw - 2 * MARGEM_H ? Math.min(MARGEM_H, Math.max(vw - MARGEM_H - d.w, tx)) : (vw - d.w) / 2;
        ty = d.h > base - topo     ? Math.min(topo,   Math.max(base - d.h, ty))        : (vh - d.h) / 2;
      }

      function aplicar() {
        quadro = 0;
        const d = dimensoes();
        raiz.style.setProperty('--largura-cartao', d.w + 'px');
        cartao.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
      }
      function agendar() { if (!quadro) quadro = requestAnimationFrame(aplicar); }

      // ---------- gestos: um dedo arrasta, dois dedos fazem zoom (pinça) ----------
      let gesto = null;      // 'arrasto' | 'pinca' | null
      let ultimo = null;     // último ponto do arrasto
      let pinca = null;      // dados da pinça no começo
      let vx = 0, vy = 0;    // velocidade do arrasto (para continuar deslizando ao soltar)
      let inerciaId = 0;

      function ignorar(alvo) {
        return alvo && alvo.closest && alvo.closest('.barra-topo, .menu-lateral, .fundo-menu, .controles, .visor-zona');
      }
      function meio(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
      function distancia(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
      function pararInercia() { if (inerciaId) { cancelAnimationFrame(inerciaId); inerciaId = 0; } }

      function iniciarPinca(t) {
        const m = meio(t), d = dimensoes();
        // guarda qual ponto do cartão está entre os dedos, para ele ficar sob os dedos durante o zoom
        pinca = { dist: Math.max(1, distancia(t)), zoom: zoom, ux: (m.x - tx) / d.w, uy: (m.y - ty) / d.h };
        gesto = 'pinca';
      }
      function iniciarArrasto(t) {
        ultimo = { x: t.clientX, y: t.clientY, t: performance.now() };
        vx = 0; vy = 0;
        gesto = 'arrasto';
      }

      document.addEventListener('touchstart', function (e) {
        if (!celular() || raiz.classList.contains('menu-aberto') || ignorar(e.target)) return;
        pararInercia();
        if (e.touches.length >= 2) iniciarPinca(e.touches); else iniciarArrasto(e.touches[0]);
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!celular() || !gesto) return;
        if (e.cancelable) e.preventDefault(); // impede o navegador de rolar ou dar zoom na página inteira
        if (gesto === 'pinca' && e.touches.length >= 2) {
          const m = meio(e.touches);
          zoom = Math.min(ZOOM_MAX, Math.max(1, pinca.zoom * distancia(e.touches) / pinca.dist));
          const d = dimensoes();
          tx = m.x - pinca.ux * d.w;
          ty = m.y - pinca.uy * d.h;
          limitar();
          agendar();
        } else if (gesto === 'arrasto' && e.touches.length === 1) {
          const t = e.touches[0], agora = performance.now();
          const dt = Math.max(1, agora - ultimo.t);
          const dx = t.clientX - ultimo.x, dy = t.clientY - ultimo.y;
          tx += dx; ty += dy;
          vx = 0.7 * vx + 0.3 * (dx / dt);
          vy = 0.7 * vy + 0.3 * (dy / dt);
          ultimo = { x: t.clientX, y: t.clientY, t: agora };
          limitar();
          agendar();
        }
      }, { passive: false });

      function fimDoToque(e) {
        if (!celular() || !gesto) return;
        if (e.touches.length >= 2) { iniciarPinca(e.touches); return; }
        if (e.touches.length === 1) { iniciarArrasto(e.touches[0]); return; } // soltou um dedo da pinça: segue arrastando
        const era = gesto;
        gesto = null; pinca = null;
        if (era === 'arrasto' && Math.hypot(vx, vy) > 0.15 && performance.now() - ultimo.t < 80) deslizar();
      }
      document.addEventListener('touchend', fimDoToque, { passive: true });
      document.addEventListener('touchcancel', fimDoToque, { passive: true });

      // o cartão continua deslizando um pouco depois de soltar o dedo
      function deslizar() {
        let t0 = performance.now();
        const passo = function (t) {
          const dt = Math.min(48, t - t0); t0 = t;
          tx += vx * dt; ty += vy * dt;
          const f = Math.pow(0.94, dt / 16);
          vx *= f; vy *= f;
          const ax = tx, ay = ty;
          limitar();
          if (tx !== ax) vx = 0;
          if (ty !== ay) vy = 0;
          aplicar();
          inerciaId = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(passo) : 0;
        };
        inerciaId = requestAnimationFrame(passo);
      }

      // iPhone/iPad: impede o zoom de pinça nativo da página
      ['gesturestart', 'gesturechange'].forEach(function (nome) {
        document.addEventListener(nome, function (e) { if (celular()) e.preventDefault(); });
      });

      // ---------- menu (botão de três barrinhas) ----------
      function abrirMenu(abrir) {
        raiz.classList.toggle('menu-aberto', abrir);
        btnMenu.setAttribute('aria-expanded', abrir ? 'true' : 'false');
        btnMenu.setAttribute('aria-label', abrir ? 'Fechar menu' : 'Abrir menu');
      }
      btnMenu.addEventListener('click', function () { abrirMenu(!raiz.classList.contains('menu-aberto')); });
      fundoMenu.addEventListener('click', function () { abrirMenu(false); });
      // escolher uma opção fecha o menu (a ação da opção já foi feita pelo script do livro)
      menu.addEventListener('click', function (e) {
        if (celular() && e.target.closest('button')) abrirMenu(false);
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') abrirMenu(false); });

      // ---------- tela girou, janela mudou ou passou de computador para celular ----------
      const mq = window.matchMedia(window.__MQ_MOBILE);
      function aoMudarModo() {
        raiz.classList.toggle('mobile', mq.matches);
        pararInercia(); gesto = null; pinca = null;
        if (mq.matches) { zoom = 1; medir(); limitar(); aplicar(); }
        else { cartao.style.transform = ''; abrirMenu(false); }
        window.dispatchEvent(new Event('resize')); // o script das medidas do computador recalcula
      }
      if (mq.addEventListener) mq.addEventListener('change', aoMudarModo); else mq.addListener(aoMudarModo);

      window.addEventListener('resize', function () {
        if (!celular()) return;
        medir(); limitar(); aplicar();
      });

      if (celular()) { medir(); limitar(); aplicar(); }
    })();
  </script>
